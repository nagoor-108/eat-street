{% extends "base.html" %}
{% block title %}Forgot Password — Eat Street{% endblock %}
{% block content %}
<style>
.auth-card-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5.5rem 1rem 3rem;
}
.auth-box {
  width: 100%;
  max-width: 440px;
}
.input-icon-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-icon-wrap .field-icon {
  position: absolute;
  left: 14px;
  color: var(--text-muted, #888);
  font-size: 1.15rem;
  pointer-events: none;
  z-index: 2;
}
.input-icon-wrap .form-control {
  padding-left: 42px;
  padding-right: 14px;
  height: 46px;
  border-radius: 12px;
  font-size: 0.95rem;
  width: 100%;
}
</style>

<div class="auth-card-wrap">
  <div class="auth-box">
    <div style="text-align:center;margin-bottom:1.8rem">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg, rgba(255,59,0,0.18), rgba(255,107,0,0.1));border:1px solid rgba(255,59,0,0.3);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;color:var(--primary, #ff3b00);margin-bottom:0.8rem">
        <i class="ri-key-2-line"></i>
      </div>
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:0.3rem">Forgot Password?</h1>
      <p style="color:var(--text-muted);font-size:0.875rem;line-height:1.4">
        Enter your registered email address and we'll send a 6-digit OTP to reset your password.
      </p>
    </div>

    <div class="card" style="padding:2rem;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08)">
      <form method="POST" action="{{ url_for('auth.forgot_password') }}" onsubmit="document.getElementById('sendOtpBtn').disabled=true; document.getElementById('sendOtpBtn').innerHTML='<i class=\'ri-loader-4-line ri-spin\'></i> Sending OTP via Email...'; this.submit();">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group" style="margin-bottom:1.4rem">
          <label class="form-label" style="font-size:0.85rem;font-weight:600;margin-bottom:0.4rem;display:block">Registered Email</label>
          <div class="input-icon-wrap">
            <i class="ri-mail-line field-icon"></i>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email" autofocus>
          </div>
        </div>

        <button type="submit" id="sendOtpBtn" class="btn btn-primary w-100 btn-lg" style="border-radius:12px;font-weight:700;letter-spacing:0.3px;height:48px;display:flex;align-items:center;justify-content:center;gap:0.5rem">
          <i class="ri-send-plane-line"></i> Send Verification OTP
        </button>
      </form>

      <div class="divider" style="margin:1.5rem 0;border-top:1px solid rgba(255,255,255,0.08)"></div>

      <p style="text-align:center;font-size:0.88rem;color:var(--text-muted);margin:0">
        Remember your password? <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:700;text-decoration:none">Back to Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
