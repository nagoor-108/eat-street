<!DOCTYPE html>
<html>
<head>
  <title>AI Chat Test — Eat Street</title>
  <style>
    body { background:#0D0D0D; color:#fff; font-family:monospace; padding:2rem; }
    h2   { color:#FF3B00; }
    #status { margin:1rem 0; padding:0.75rem; background:#1E1E1E; border-radius:8px; }
    #output { white-space:pre-wrap; background:#161616; padding:1rem; border-radius:8px;
              border:1px solid #333; min-height:100px; margin-top:1rem; color:#0f0; }
    button { background:#FF3B00; color:#fff; border:none; padding:0.6rem 1.2rem;
             border-radius:8px; cursor:pointer; font-size:1rem; margin-right:0.5rem; }
    button:hover { background:#FF6B35; }
    .ok  { color:#4CAF50; }
    .err { color:#F44336; }
  </style>
</head>
<body>
  <h2>🤖 Eat Street AI — Live Test</h2>

  <div id="status">Checking Ollama status…</div>

  <div style="margin:1rem 0; display:flex; gap:0.5rem; flex-wrap:wrap">
    <button onclick="checkStatus()">🔍 Check Status</button>
    <button onclick="testStream('What momos are available?')">🥟 Test: Momos?</button>
    <button onclick="testStream('Show chicken dishes')">🍗 Test: Chicken?</button>
    <button onclick="testStream('Veg food under Rs.100')">🥦 Test: Veg &lt;₹100?</button>
    <button onclick="clearOutput()">🗑 Clear</button>
  </div>

  <div id="output">Click a button to test…</div>

<script>
async function checkStatus() {
  const out = document.getElementById('status');
  out.innerHTML = 'Checking…';
  try {
    const r    = await fetch('/ai/status');
    const data = await r.json();
    if (data.online) {
      out.innerHTML = `<span class="ok">✅ Ollama ONLINE</span> | Models: ${data.models.join(', ')} | Using: <strong>${data.using}</strong>`;
    } else {
      out.innerHTML = `<span class="err">❌ Ollama OFFLINE — ${data.error}</span>`;
    }
  } catch(e) {
    out.innerHTML = `<span class="err">❌ Flask error: ${e.message}</span>`;
  }
}

async function testStream(question) {
  const out = document.getElementById('output');
  out.textContent = `Sending: "${question}"\n\nWaiting for Ollama (llama3 takes ~30s first time)...\n\n`;

  try {
    const resp = await fetch('/ai/stream', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ message: question }),
    });

    if (!resp.ok) {
      out.textContent += `\n❌ HTTP ${resp.status}: ${await resp.text()}`;
      return;
    }

    out.textContent = `Q: ${question}\nA: `;
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        try {
          const payload = JSON.parse(line.slice(5).trim());
          if (payload.done) { out.textContent += '\n\n✅ Stream complete!'; return; }
          if (payload.token) out.textContent += payload.token;
        } catch(_) {}
      }
    }
  } catch(e) {
    out.textContent += `\n\n❌ Error: ${e.message}`;
  }
}

function clearOutput() {
  document.getElementById('output').textContent = '';
}

// Auto check on load
checkStatus();
</script>
</body>
</html>
